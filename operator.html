<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/operator.js" defer></script>
</head>

<body>
  <div class="wrap">
    <button class="back"><a href="./index.html">Go to list</a></button>
    <div class="example">
      <h4>1. 산술 연산자</h4>
      <ul>
        <li id="add">덧셈
          <div class="answer">
            <input type="number" id="addVal1"> + <input type="number" id="addVal2"> = <p class="result"></p>
          </div>
        </li>
        <li id="sub">뺄셈
          <div class="answer">
            <input type="number" id="subVal1"> - <input type="number" id="subVal2"> = <p class="result"></p>
          </div>
        </li>
        <li id="mul">곱셈
          <div class="answer">
            <input type="number" id="mulVal1"> * <input type="number" id="mulVal2"> = <p class="result"></p>
          </div>
        </li>
        <li id="division">나눗셈
          <div class="answer">
            <input type="number" id="divVal1"> / <input type="number" id="divVal2"> = <p class="result"></p>
          </div>
        </li>
        <li id="mod">나머지
          <div class="answer">
            <input type="number" id="modVal1"> / <input type="number" id="modVal2"> = <p class="result"></p>
          </div>
        </li>
      </ul>
    </div>
    <div class="example">
      <h4>2. 증감 연산자</h4>
      <ul>
        <li id="preAdd">전위 증가 연산자
          <div class="answer">
            <button id="preAddBtn">++num</button>
            <button class="reset">Reset</button>
            <span>num : 0 result : 0</span>
          </div>
        </li>
        <li id="posAdd">후위 증가 연산자
          <div class="answer">
            <button id="posAddBtn">num++</button>
            <button class="reset">Reset</button>
            <span>num : 0 result : 0</span>
          </div>
        </li>
        <li id="preSub">전위 감소 연산자
          <div class="answer">
            <button id="preSubBtn">--num</button>
            <button class="reset">Reset</button>
            <span>num : 100 result : 0</span>
          </div>
        </li>
        <li id="posSub">후위 감소 연산자
          <div class="answer">
            <button id="posSubBtn">num--</button>
            <button class="reset">Reset</button>
            <span>num : 100 result : 0</span>
          </div>
        </li>
      </ul>
    </div>
    <div class="example">
      <h4>3. 대입 연산자</h4>
      <ul>
        <li></li>
      </ul>
    </div>
    <div class="example">
      <h4>4. 비교 연산자</h4>
      <ul>
        <li></li>
      </ul>
    </div>
    <div class="example">
      <h4>5. 논리 연산자</h4>
      <ul>
        <li></li>
      </ul>
    </div>

  </div>
</body>

</html>
